name: MIDA DZ iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Create a signed iPhone release build
        required: true
        type: boolean
        default: false
      upload_testflight:
        description: Upload the signed IPA to TestFlight after export
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS app
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build/logs build/DerivedData
          xcodebuild \
            -project MidaDZ.xcodeproj \
            -scheme MidaDZ \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build \
            | tee build/logs/xcodebuild-build.log

      - name: Run unit tests on an iPhone simulator
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/logs build/TestResults
          xcodebuild \
            -project MidaDZ.xcodeproj \
            -scheme MidaDZ \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults/MidaDZ.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            | tee build/logs/xcodebuild-test.log

      - name: Package simulator app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/MidaDZ.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/MidaDZ-simulator.zip
          printf 'Build completed successfully\n' > build/build-status.txt

      - name: Write test status
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            printf 'Tests passed\n' > build/test-status.txt
          else
            printf 'Tests did not complete successfully. See uploaded logs and xcresult bundle.\n' > build/test-status.txt
          fi

      - name: Upload simulator app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mida-dz-ios-simulator-${{ github.run_number }}
          path: |
            build/MidaDZ-simulator.zip
            build/build-status.txt
            build/test-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mida-dz-ios-diagnostics-${{ github.run_number }}
          path: |
            build/logs/
            build/TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Add run summary
        if: always()
        run: |
          {
            echo "## MIDA DZ iOS CI"
            echo
            echo "- Build runner: macOS 14"
            echo "- Xcode: $(xcodebuild -version | tr '\\n' ' ')"
            echo "- Build: ${{ job.status }}"
            echo "- Tests: ${{ steps.tests.outcome }}"
            echo
            echo "The simulator `.app` is uploaded as a workflow artifact. Signed device releases are available through the manual release input."
          } >> "$GITHUB_STEP_SUMMARY"

  signed-release:
    name: Archive signed iPhone release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
    needs: build-and-test
    runs-on: macos-14
    environment: ios-release
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/MidaDZ_Distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/midadz-signing.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/MidaDZ.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/MidaDZ-profile.plist"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISION_PROFILE_NAME }}
        run: |
          set -o pipefail
          mkdir -p build/logs build/MidaDZ.xcarchive
          xcodebuild \
            -project MidaDZ.xcodeproj \
            -scheme MidaDZ \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MidaDZ.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive \
            | tee build/logs/xcodebuild-archive.log

      - name: Create App Store export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISION_PROFILE_NAME }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.abdou1lalmi.midadz</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/MidaDZ.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            | tee build/logs/xcodebuild-export.log
          test -f build/export/MidaDZ.ipa

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mida-dz-ios-signed-${{ github.run_number }}
          path: |
            build/export/MidaDZ.ipa
            build/ExportOptions.plist
          if-no-files-found: error
          retention-days: 7

      - name: Prepare App Store Connect API key
        if: ${{ inputs.upload_testflight == true }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          echo -n "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode > "$PRIVATE_KEYS_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$PRIVATE_KEYS_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_testflight == true }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file build/export/MidaDZ.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            | tee build/logs/appstore-upload.log

      - name: Upload signed release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mida-dz-ios-release-diagnostics-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean temporary signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && security list-keychains -d user | grep -Fq "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Add release summary
        if: always()
        run: |
          {
            echo "## MIDA DZ signed release"
            echo
            echo "- Archive and export job: ${{ job.status }}"
            echo "- IPA artifact: mida-dz-ios-signed-${{ github.run_number }}"
            if [ "${{ inputs.upload_testflight }}" = "true" ]; then
              echo "- TestFlight upload: requested; check the App Store Connect processing status"
            else
              echo "- TestFlight upload: skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
