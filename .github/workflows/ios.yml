name: MIDA DZ iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS app
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build/logs build/DerivedData
          xcodebuild \
            -project MidaDZ.xcodeproj \
            -scheme MidaDZ \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build \
            | tee build/logs/xcodebuild-build.log

      - name: Run unit tests on an iPhone simulator
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/logs build/TestResults
          xcodebuild \
            -project MidaDZ.xcodeproj \
            -scheme MidaDZ \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults/MidaDZ.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            | tee build/logs/xcodebuild-test.log

      - name: Package simulator app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/MidaDZ.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/MidaDZ-simulator.zip
          printf 'Build completed successfully\n' > build/build-status.txt

      - name: Write test status
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            printf 'Tests passed\n' > build/test-status.txt
          else
            printf 'Tests did not complete successfully. See uploaded logs and xcresult bundle.\n' > build/test-status.txt
          fi

      - name: Upload simulator app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mida-dz-ios-simulator-${{ github.run_number }}
          path: |
            build/MidaDZ-simulator.zip
            build/build-status.txt
            build/test-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mida-dz-ios-diagnostics-${{ github.run_number }}
          path: |
            build/logs/
            build/TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Add run summary
        if: always()
        run: |
          {
            echo "## MIDA DZ iOS CI"
            echo
            echo "- Build runner: macOS 14"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Build: ${{ job.status }}"
            echo "- Tests: ${{ steps.tests.outcome }}"
            echo
            echo "The simulator `.app` is uploaded as a workflow artifact. This workflow does not sign or install the app on a physical iPhone."
          } >> "$GITHUB_STEP_SUMMARY"
