name: MidaDZ
options:
  minimumXcodeGenVersion: 2.45.0
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MidaDZ:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MidaDZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdou1lalmi.midadz
        INFOPLIST_KEY_CFBundleDisplayName: MIDA DZ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_EMIT_LOC_STRINGS: true
    scheme:
      testTargets:
        - MidaDZTests
  MidaDZTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MidaDZTests
    dependencies:
      - target: MidaDZ
